<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<title>OJ · Biblioteca de estudos</title>
<script src="../legacy-gate.js"></script>
<style>
:root{--navy:#17233a;--ink:#1b2a43;--muted:#62728a;--line:#dfe5ee;--orange:#f47735;--cream:#fff8ef;--paper:#fff;--bg:#f5f7fb;--shadow:0 15px 40px rgba(22,36,58,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit}
button,input{font:inherit}button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffbb78;outline-offset:3px}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;min-height:70px;padding:14px max(20px,calc((100vw - 1300px)/2));box-shadow:0 3px 12px #17233a23}
.logo{font:700 23px Georgia,serif;letter-spacing:-.5px}.top .detail{font-size:12px;color:#b5c1d4}.top .space{flex:1}
.top a{text-decoration:none;padding:7px 11px;border:1px solid #4c5d76;border-radius:9px;color:#f3f6ff;font-size:12px}
.top a:hover{background:#ffffff16}
.wrap{max-width:1300px;padding:42px 22px 65px;margin:0 auto}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:#c45d22;font-weight:800}
h1{font-family:Georgia,serif;font-weight:600;letter-spacing:-.035em;font-size:clamp(34px,5vw,53px);line-height:1.14;margin:9px 0 12px}
.lead{max-width:790px;color:var(--muted);font-size:16px;margin:0 0 22px}
.statline{display:flex;flex-wrap:wrap;gap:11px;margin:22px 0 25px}
.stat{background:#fff;border:1px solid #e3e8ef;border-radius:11px;padding:9px 13px;color:#536279;font-size:13px}
.stat strong{color:var(--ink)}
.searchwrap{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:6px 14px;margin-bottom:23px;max-width:540px;box-shadow:var(--shadow)}
.searchwrap svg{flex:none;color:#6e7990}.searchwrap input{border:none;outline:none;width:100%;padding:10px 0;color:var(--ink);background:transparent}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.folder{display:block;position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;text-decoration:none;min-height:186px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s}
.folder:hover{transform:translateY(-3px);border-color:#f3b48d;box-shadow:0 20px 50px rgba(22,36,58,.11)}
.folder-top{display:flex;justify-content:space-between;align-items:center}
.folder-symbol{background:var(--cream);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;color:#bc5c26}
.folder-symbol svg{width:24px;height:24px}
.folder-num{font-size:12px;color:#96a2b2;letter-spacing:.12em;font-weight:700}
.folder h2{font:600 23px/1.25 Georgia,serif;margin:17px 0 12px}
.folder-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#617188;font-size:12px}
.ready{color:#0b8058;background:#e7f7ef;padding:4px 8px;border-radius:999px;font-weight:700}
.empty-label{color:#929bac}
.section-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:17px}
.back{border:1px solid #e2d3c1;border-radius:10px;padding:9px 13px;text-decoration:none;font-size:13px;font-weight:650;background:#fff;color:#994e24}
.back:hover{background:var(--cream)}
.topic-panel{border:1px solid var(--line);background:#fff;border-radius:19px;box-shadow:var(--shadow);padding:24px;margin-top:16px}
.topic-panel h2{font:600 23px/1.35 Georgia,serif;margin:0 0 13px}
.topic-list{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:topic}
.topic-row{display:flex;align-items:center;gap:13px;background:#fbfcfe;border:1px solid #e7ebf1;border-radius:12px;padding:13px 14px;min-height:63px}
.topic-index{flex:0 0 30px;color:#97a3b4;font-size:12px;font-weight:700}
.topic-text{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:550}
.topic-status{flex:none;font-size:11px;color:#8996a8;border:1px solid #dce3eb;border-radius:99px;padding:4px 9px;white-space:nowrap}
.topic-row.active{background:#fff9f1;border-color:#f5c399}
.topic-row.active .topic-status{color:#15724e;border-color:#a3d9be;background:#e9f8ef}
.topic-row a{text-decoration:none;color:#94420c;font-weight:750;border-bottom:1px solid transparent}
.topic-row a:hover{border-color:#94420c}
.topic-row .quiz-link{flex:none;border:1px solid #b78560;border-radius:9px;padding:5px 9px;font-size:12px;background:#3a2b25;color:#ffd2ae;font-weight:750}
.topic-row .quiz-link:hover{background:#52372b;color:#fff;border-color:#e7a978}
.blank{border:1px dashed #cbd7e4;background:#f7f9fc;color:#63728b;border-radius:13px;padding:24px}
.hidden{display:none!important}
footer{margin-top:45px;color:#8592a5;font-size:12px;text-align:center}
@media(max-width:1040px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.wrap{padding:27px 14px 45px}.grid{grid-template-columns:1fr}.folder{min-height:154px;padding:20px}.folder h2{margin:12px 0}.top{padding:12px 15px;gap:8px;flex-wrap:wrap}.top .detail{display:none}.topic-panel{padding:13px}.topic-row{gap:7px;align-items:flex-start}.topic-index{flex-basis:22px}.topic-status{font-size:10px;padding:3px 6px}.statline{gap:7px}.stat{padding:7px 10px}}
</style>
<link rel="stylesheet" href="./noite.css">
</head>
<body>
<header class="top">
  <span class="logo">OJ · Legis Lectiones</span>
  <span class="detail">Biblioteca de estudos</span>
  <span class="space"></span>
  <a href="../" title="Página inicial">Legis Lectiones</a>
</header>
<main class="wrap">
  <div id="view" aria-live="polite">
    <div class="eyebrow">Biblioteca</div>
    <h1>Disciplinas</h1>
    <p class="lead">Carregando a organização dos conteúdos…</p>
  </div>
  <footer>Legis Lectiones · Área de estudos</footer>
</main>
<script>
(() => {
  "use strict";
  const view=document.getElementById("view");
  const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const topics=d=>d.groups.flatMap(g=>g.topics);
  const folderIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>';
  const searchIcon='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>';
  let catalog=null;
  const totalCount=()=>catalog.disciplines.reduce((sum,d)=>sum+topics(d).length,0);
  const activeCount=d=>topics(d).filter(t=>Boolean(t.href)).length;
  const safeHref=x=>typeof x==="string"&&/^\.\/[a-z0-9/_-]+\.html(?:\?modulo=[a-z0-9-]+)?$/.test(x)?x:null;
  const findSelected=()=>catalog.disciplines.find(d=>d.id===decodeURIComponent(location.hash.slice(1)))||null;
  function card(d,index){
    const n=topics(d).length,active=activeCount(d);
    return '<a class="folder" href="#'+esc(d.id)+'" aria-label="Abrir '+esc(d.title)+'">'
      +'<div class="folder-top"><span class="folder-symbol">'+folderIcon+'</span><span class="folder-num">'+String(index+1).padStart(2,"0")+'</span></div>'
      +'<h2>'+esc(d.title)+'</h2>'
      +'<div class="folder-bottom"><span>'+(n?n+' '+(n===1?'tema':'temas'):'A organizar')+'</span>'
      +(active?'<span class="ready">'+active+' disponível</span>':'<span class="empty-label">A estruturar</span>')
      +'</div></a>';
  }
  function showOverview(){
    const ds=catalog.disciplines;
    view.innerHTML='<div class="eyebrow">Organização de conteúdos</div><h1>Disciplinas</h1>'
      +'<p class="lead">Selecione uma disciplina para ver seus temas. A organização acompanha a sequência de aulas; os materiais serão acrescentados gradualmente.</p>'
      +'<div class="statline"><span class="stat"><strong>'+ds.length+'</strong> disciplinas</span>'
      +'<span class="stat"><strong>'+totalCount()+'</strong> temas catalogados</span>'
      +'<span class="stat"><strong>'+ds.reduce((n,d)=>n+activeCount(d),0)+'</strong> módulos disponíveis</span></div>'
      +'<label class="searchwrap">'+searchIcon+'<input id="search" type="search" placeholder="Buscar disciplina ou tema" aria-label="Buscar disciplina ou tema" autocomplete="off"></label>'
      +'<div class="grid" id="folders">'+ds.map(card).join('')+'</div>'
      +'<div class="blank hidden" id="none">Nenhuma disciplina ou tema corresponde à busca.</div>';
    const input=document.getElementById("search");
    input.addEventListener("input",()=>{
      const normalize=v=>String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
      const term=normalize(input.value.trim());
      const filtered=ds.filter(d=>normalize(d.title).includes(term)||topics(d).some(t=>normalize(t.title).includes(term)));
      document.getElementById("folders").innerHTML=filtered.map(d=>card(d,ds.indexOf(d))).join('');
      document.getElementById("none").classList.toggle("hidden",filtered.length!==0);
    });
  }
  function showSubject(d){
    let index=0;
    const groups=d.groups.map(group=>{
      const rows=group.topics.map(t=>{
        const number=String(++index).padStart(2,"0"),href=safeHref(t.href);
        return '<li class="topic-row'+(href?' active':'')+'"><span class="topic-index">'+number+'</span>'
          +(href?'<a class="topic-text" href="'+esc(href)+'">'+esc(t.title)+'</a>':'<span class="topic-text">'+esc(t.title)+'</span>')
          +'<span class="topic-status">'+(href?'Abrir conteúdo':'Em preparação')+'</span>'+'</li>';
      }).join("");
      return '<section class="topic-panel"><h2>'+esc(group.title)+'</h2><ol class="topic-list">'+rows+'</ol></section>';
    }).join("");
    view.innerHTML='<div class="section-head"><a href="#" class="back">Todas as disciplinas</a><span class="eyebrow">Sequência de estudo</span></div>'
      +'<h1>'+esc(d.title)+'</h1>'
      +'<p class="lead">'+(index?index+' '+(index===1?'tema organizado':'temas organizados')+'.':'Os temas desta área ainda não foram cadastrados.')
      +' Abra os que já estiverem disponíveis; os demais serão desenvolvidos em etapas.</p>'
      +(groups||'<div class="blank">Área reservada para receber os próximos conteúdos.</div>');
  }
  function render(){
    if(!catalog)return;
    const selected=findSelected();
    if(selected)showSubject(selected);
    else showOverview();
    window.scrollTo({top:0,behavior:"instant"});
  }
  window.addEventListener("hashchange",render);
  fetch("./catalogo.json",{cache:"no-store"})
    .then(response=>{if(!response.ok)throw Error("Não foi possível carregar o catálogo (HTTP "+response.status+").");return response.json()})
    .then(data=>{
      if(!Array.isArray(data.disciplines)||data.disciplines.length!==14)throw Error("Catálogo incompleto.");
      catalog=data;
      render();
    })
    .catch(e=>{view.innerHTML='<div class="eyebrow">Erro de carregamento</div><h1>Catálogo indisponível</h1><p class="lead">'+esc(e.message)+'</p><p>Atualize a página; se o erro persistir, confira o arquivo <code>oj/catalogo.json</code>.</p>';});
})();
</script>
</body>
</html>
