<script>window.ARTICLES=[{"n":1,"title":"Quando a lei começa a valer?","scene":"B comemora a publicação de uma lei. H pergunta: “Já precisamos cumprir hoje?”. B consulta o calendário antes de responder.","rule":"Regra geral: 45 dias após a publicação oficial, salvo disposição contrária. No exterior, quando admitida a obrigatoriedade da lei brasileira, três meses. Republicação corretiva antes de vigorar reinicia a contagem; correção de lei já vigente é lei nova.","legal":"Salvo disposição contrária, a lei começa a vigorar em todo o país quarenta e cinco dias depois de oficialmente publicada.","question":"Uma lei foi publicada sem indicar data de início da vigência. Em regra, quando passa a vigorar no Brasil?","choices":["Na data da assinatura","45 dias depois da publicação oficial","Três meses depois, necessariamente","Somente quando um juiz autorizar"],"correct":1,"why":"A regra brasileira é de 45 dias; não confunda com os três meses para obrigatoriedade no exterior, quando admitida.","flag":null,"terms":["vacatio legis: intervalo entre publicação e vigência","errata: correção do texto publicado"],"group":"01-03"},{"n":2,"title":"Lei nova e lei antiga","scene":"A nova Lei B chega à oficina de H. A antiga Lei A pergunta: “Vou deixar de valer?”. B responde: “Depende: preciso revogar expressamente, ser incompatível ou regular inteiramente sua matéria”.","rule":"A lei sem vigência temporária continua até ser modificada ou revogada. A posterior revoga a anterior se o declarar expressamente, for incompatível ou regular integralmente a matéria. Regra nova paralela não revoga necessariamente a antiga. Lei revogada não retorna automaticamente.","legal":"Não se destinando à vigência temporária, a lei terá vigor até que outra a modifique ou revogue.","question":"B é uma lei posterior que apenas acrescenta disposições gerais compatíveis, ao lado da lei A. O que ocorre?","choices":["A lei A é sempre integralmente revogada","A lei B é automaticamente revogada","A lei A não é necessariamente revogada","A lei A retorna de revogação anterior"],"correct":2,"why":"O art. 2º, §2º, impede presumir revogação quando a lei nova disciplina regras gerais ou especiais paralelas sem conflito. Direção correta: LEI B (nova) → PODE REVOGAR → LEI A (antiga).","flag":null,"terms":["revogação: retirada da vigência de norma","repristinação: retorno de norma anteriormente revogada, que não é automático"],"group":"01-03"},{"n":3,"title":"“Eu não sabia!”","scene":"H recebe uma exigência legal e diz ao juiz J: “Mas eu não conhecia essa lei!”. J explica por que isso não afasta o dever de cumpri-la.","rule":"Ninguém se escusa de cumprir a lei alegando que não a conhece.","legal":"Ninguém se escusa de cumprir a lei, alegando que não a conhece.","question":"Qual alegação, por si só, não dispensa H de cumprir uma lei aplicável?","choices":["Desconhecimento da lei","Existência de decisão transitada em julgado","Revogação expressa da norma","Inconstitucionalidade reconhecida no caso"],"correct":0,"why":"O art. 3º afasta a desculpa genérica de desconhecimento; isso não significa que lei revogada seja exigível.","flag":null,"terms":[],"group":"01-03"},{"n":4,"title":"A lei deixou uma lacuna","scene":"J procura a solução de um caso, mas o texto legal não cobre a situação. Na mesa surgem três ferramentas: analogia, costumes e princípios gerais de direito.","rule":"Quando a lei for omissa, o juiz decide por analogia, costumes e princípios gerais de direito. A enumeração legal não significa uma escada rígida que sempre deva ser percorrida mecanicamente.","legal":"Quando a lei for omissa, o juiz decidirá o caso de acordo com a analogia, os costumes e os princípios gerais de direito.","question":"Para lidar com omissão da lei, J pode recorrer a qual conjunto?","choices":["Portarias, entrevistas e vontade pessoal","Analogia, costumes e princípios gerais do direito","Somente precedentes estrangeiros","Apenas analogia, vedadas outras fontes"],"correct":1,"why":"A LINDB cita expressamente analogia, costumes e princípios gerais de direito.","flag":"A ilustração enumera os três instrumentos com números; isso ajuda a memorizar, mas não estabelece ordem legal obrigatória.","terms":["analogia: solução de caso semelhante","costumes: práticas reiteradas reconhecidas como juridicamente relevantes"],"group":"04-06"},{"n":5,"title":"A lei e o bem comum","scene":"J precisa aplicar uma regra numa cidade atingida por uma enchente. A leitura literal isolada parece não contemplar o fim social da medida.","rule":"Na aplicação da lei, o juiz atende aos fins sociais a que ela se dirige e às exigências do bem comum.","legal":"Na aplicação da lei, o juiz atenderá aos fins sociais a que ela se dirige e às exigências do bem comum.","question":"Ao aplicar uma lei, que dois critérios J deve considerar expressamente?","choices":["Fins sociais e exigências do bem comum","Somente arrecadação e lucro","Preferência pessoal e conveniência","Unicamente a lei estrangeira"],"correct":0,"why":"O art. 5º aponta fins sociais e exigências do bem comum como critérios interpretativos.","flag":null,"terms":[],"group":"04-06"},{"n":6,"title":"O passado protegido","scene":"Uma lei nova chega à cidade. H teme perder um negócio jurídico já concluído; B já tem um direito adquirido; J lembra que uma decisão não admite mais recurso.","rule":"A lei em vigor tem efeito imediato e geral, respeitando ato jurídico perfeito, direito adquirido e coisa julgada.","legal":"A Lei em vigor terá efeito imediato e geral, respeitados o ato jurídico perfeito, o direito adquirido e a coisa julgada.","question":"Qual trio deve ser respeitado quando entra em vigor uma lei nova?","choices":["Prazo judicial, multa e denúncia","Ato jurídico perfeito, direito adquirido e coisa julgada","Somente contratos e multas","Apenas decisões ainda recorríveis"],"correct":1,"why":"O ato jurídico perfeito já se consumou sob lei vigente; direito adquirido integra a esfera do titular; coisa julgada é a decisão sem recurso cabível.","flag":null,"terms":["intertemporal: conflito entre regras vigentes em momentos diferentes"],"group":"04-06"},{"n":7,"title":"A pessoa que mudou de país","scene":"B deixa o Brasil e passa a morar habitualmente em outro país. H pergunta qual lei rege seu nome, capacidade e relações de família.","rule":"Em regra, a lei do país do domicílio rege personalidade, nome, capacidade e direitos de família. Há regras específicas para casamento no Brasil e para cônjuges com domicílios diferentes.","legal":"A lei do país em que domiciliada a pessoa determina as regras sobre o começo e o fim da personalidade, o nome, a capacidade e os direitos de família.","question":"Para definir a capacidade civil de B em contexto internacional, qual conexão é a regra geral?","choices":["Sua nacionalidade, sempre","O país onde foi lavrado o documento","O país de seu domicílio","O país em que ocorreu a última viagem"],"correct":2,"why":"O art. 7º adota, em regra, a lei do domicílio para os assuntos enumerados.","flag":"O texto do art. 7º, §6º, e os quadros sobre divórcio estrangeiro precisam ser lidos junto do CPC atual: o divórcio consensual simples no exterior dispensa homologação do STJ.","terms":["domicílio: conexão jurídica com determinado lugar"],"group":"07-09"},{"n":8,"title":"Onde está o bem?","scene":"H possui um imóvel em outro país. B sugere usar automaticamente a lei do domicílio do proprietário para tudo.","rule":"A lei do lugar onde estão situados os bens rege a qualificação e as relações a eles pertinentes. Há regras específicas para bens móveis transportados e para penhor.","legal":"Para qualificar os bens e regular as relações a eles concernentes, aplicar-se-á a lei do país em que estiverem situados.","question":"Um imóvel de H fica no país X. Como regra de conexão, aplica-se:","choices":["A lei do país X, onde o imóvel está situado","A lei do país de nascimento do proprietário","A lei escolhida pelo vizinho","Sempre a lei brasileira"],"correct":0,"why":"O art. 8º aplica a lei da situação do bem; não esqueça as exceções dos §§1º e 2º para móveis em transporte e penhor.","flag":null,"terms":[],"group":"07-09"},{"n":9,"title":"Contrato entre países","scene":"B, proponente domiciliado no país X, envia proposta contratual a H, no Brasil. Surge a dúvida: onde se considera constituída a obrigação?","rule":"As obrigações seguem a lei do país em que se constituem; obrigação decorrente de contrato considera-se constituída no lugar de residência do proponente. Se executada no Brasil e depender de forma essencial, observa-se essa forma.","legal":"Para qualificar e reger as obrigações, aplicar-se-á a lei do país em que se constituírem.","question":"Para uma obrigação contratual internacional, a LINDB considera local de sua constituição:","choices":["O domicílio do destinatário da proposta","O lugar de residência do proponente","O país da assinatura digital, sempre","O local de pagamento, sempre"],"correct":1,"why":"O §2º do art. 9º adota o local da residência do proponente para a obrigação resultante de contrato.","flag":null,"terms":[],"group":"07-09"},{"n":10,"title":"Herança com bens em dois países","scene":"B falece domiciliado em outro país e deixa bens no Brasil. H, herdeiro, supõe que toda sucessão será regida pela lei do local de cada bem.","rule":"A sucessão por morte ou ausência segue a lei do país do domicílio do falecido ou ausente, independentemente de localização ou natureza dos bens; há proteção especial a cônjuge ou filhos brasileiros relativa a bens de estrangeiros no Brasil.","legal":"A sucessão por morte ou por ausência obedece à lei do país em que domiciliado o defunto ou o desaparecido, qualquer que seja a natureza e a situação dos bens.","question":"Qual é o principal critério de conexão para a sucessão internacional?","choices":["Domicílio do falecido ou desaparecido","Local de cada bem, sem exceções","País onde nasceu o primeiro herdeiro","Nacionalidade do inventariante"],"correct":0,"why":"O art. 10 usa o domicílio do falecido; o §1º prevê regra protetiva referente a bens no Brasil e familiares brasileiros.","flag":null,"terms":[],"group":"10-12"},{"n":11,"title":"Fundação estrangeira no Brasil","scene":"Uma fundação foi constituída no país X e quer instalar filial no Brasil. H diz que basta alugar uma sala.","rule":"Organizações de interesse coletivo seguem a lei do Estado de constituição; para estabelecer filial, agência ou estabelecimento no Brasil, há exigência de aprovação dos atos constitutivos pelo governo brasileiro.","legal":"As organizações destinadas a fins de interesse coletivo [...] obedecem à lei do Estado em que se constituírem.","question":"A lei que rege originalmente uma fundação constituída no país X é, como regra:","choices":["A do país com mais filiais","A do Estado em que foi constituída","A do local de nascimento do diretor","Sempre a de qualquer país em que atuar"],"correct":1,"why":"O art. 11 usa o Estado de constituição; a instalação no Brasil depende da aprovação exigida pelo §1º.","flag":null,"terms":[],"group":"10-12"},{"n":12,"title":"Quem pode julgar?","scene":"H mora no Brasil e é acionado por B. Outra disputa trata da propriedade de imóvel situado no Brasil.","rule":"A autoridade brasileira é competente quando o réu é domiciliado no Brasil ou a obrigação deve ser cumprida aqui. Em ações relativas a imóveis situados no Brasil, a competência brasileira é exclusiva na previsão legal.","legal":"É competente a autoridade judiciária brasileira, quando for o réu domiciliado no Brasil ou aqui tiver de ser cumprida a obrigação.","question":"Uma ação versa sobre imóvel localizado no Brasil. Segundo a LINDB, a autoridade para conhecê-la é:","choices":["Exclusivamente estrangeira","Escolhida sempre pelo autor","A brasileira, com competência exclusiva","Sempre a do país do proprietário"],"correct":2,"why":"O art. 12, §1º, reserva à autoridade judiciária brasileira as ações relativas a imóveis situados no país.","flag":"Conferir em conjunto com o CPC vigente as hipóteses de jurisdição internacional e cooperação judicial.","terms":[],"group":"10-12"},{"n":13,"title":"Provas vindas do exterior","scene":"B quer provar em juízo brasileiro um fato ocorrido no país X. J precisa decidir qual lei disciplina os meios de prova.","rule":"Em fatos ocorridos fora do Brasil, ônus e meios de prova seguem a lei do lugar do fato; os tribunais brasileiros não admitem provas desconhecidas pelo direito brasileiro.","legal":"A prova dos fatos ocorridos em país estrangeiro rege-se pela lei que nele vigorar, quanto ao ônus e aos meios de produzir-se.","question":"Qual lei rege, em princípio, os meios de prova de fatos ocorridos no país X?","choices":["A lei do país X, respeitado o limite brasileiro de admissibilidade","Sempre a lei brasileira sem distinção","A lei do país de domicílio do juiz","A lei que o autor preferir"],"correct":0,"why":"O art. 13 distingue lei do local do fato e limite de admissibilidade perante tribunais brasileiros.","flag":null,"terms":[],"group":"13-15"},{"n":14,"title":"O juiz não conhece a lei estrangeira","scene":"B pede aplicação de uma lei do país X. J responde: “Não conheço o conteúdo e não sei se ainda está em vigor”.","rule":"O juiz pode exigir de quem invoca a lei estrangeira prova de seu texto e de sua vigência.","legal":"Não conhecendo a lei estrangeira, poderá o juiz exigir de quem a invoca prova do texto e da vigência.","question":"O juiz pode exigir de B que demonstre:","choices":["Só a tradução do contrato","Texto e vigência da lei estrangeira invocada","A opinião de três testemunhas","A publicação da lei brasileira"],"correct":1,"why":"O art. 14 menciona exatamente texto e vigência, e emprega o verbo “poderá”.","flag":null,"terms":[],"group":"13-15"},{"n":15,"title":"Uma sentença cruza a fronteira","scene":"H venceu processo no país X e quer produzir efeitos da decisão no Brasil. J precisa conferir os requisitos legais e o procedimento atual.","rule":"Sentença estrangeira exige condições de eficácia; a homologação, quando necessária, é de competência do STJ, não do STF. Divórcio consensual simples estrangeiro constitui exceção à exigência de homologação.","legal":"O art. 15 enumera requisitos da sentença estrangeira, incluindo competência, citação/revelia, trânsito em julgado, tradução e homologação (quando exigível).","question":"Hoje, de quem é a competência constitucional para homologar sentença estrangeira, quando a homologação for necessária?","choices":["STF","TST","STJ","CNJ"],"correct":2,"why":"A EC 45/2004 transferiu a competência para o STJ. O texto histórico de materiais que menciona STF deve ser atualizado.","flag":"ATENÇÃO: os slides e a redação histórica do art. 15 mencionam STF; hoje a homologação compete ao STJ. Divórcio consensual simples pode produzir efeitos sem homologação, nos termos do CPC.","terms":[],"group":"13-15"},{"n":16,"title":"A lei estrangeira aponta para outra lei","scene":"J aplica a lei do país X, mas ela envia o caso para a lei do país Y. B pergunta se J deve continuar seguindo a remissão.","rule":"A LINDB, em regra, rejeita o reenvio: considera-se a disposição material da lei estrangeira aplicável, sem seguir a remissão que ela faz a outro ordenamento.","legal":"Quando [...] se houver de aplicar a lei estrangeira, ter-se-á em vista a disposição desta, sem considerar-se qualquer remissão por ela feita a outra lei.","question":"Se a lei estrangeira aplicável remeter o caso à lei de outro país, a regra da LINDB é:","choices":["Seguir todas as remissões indefinidamente","Desconsiderar a remissão","Aplicar sempre a lei brasileira","Devolver a escolha às partes"],"correct":1,"why":"O art. 16 impede o reenvio na solução prevista pela LINDB.","flag":null,"terms":["reenvio (renvoi): remissão de uma lei estrangeira a outro ordenamento"],"group":"16-18"},{"n":17,"title":"Três portas de proteção","scene":"Um ato estrangeiro pretende produzir efeitos no Brasil. H encontra três escudos na entrada do sistema jurídico brasileiro.","rule":"Leis, atos, decisões e declarações estrangeiras não têm eficácia no Brasil se ofenderem a soberania nacional, a ordem pública ou os bons costumes.","legal":"As leis, atos e sentenças de outro país [...] não terão eficácia no Brasil, quando ofenderem a soberania nacional, a ordem pública e os bons costumes.","question":"Qual conjunto pode impedir eficácia de um ato estrangeiro no Brasil?","choices":["Lucro, sigilo comercial e publicidade","Soberania nacional, ordem pública e bons costumes","Tributação, férias e salário","Apenas ausência de testemunhas"],"correct":1,"why":"Os três limites estão expressos no art. 17.","flag":null,"terms":[],"group":"16-18"},{"n":18,"title":"B no consulado brasileiro","scene":"B mora fora do Brasil e procura o consulado para registrar o nascimento de filho brasileiro. Outro casal busca divórcio consensual.","rule":"As autoridades consulares brasileiras praticam atos de casamento, registro civil e tabelionato nas hipóteses legais. A separação ou divórcio consensual consular exige ausência de filhos menores ou incapazes e assistência de advogado.","legal":"Tratando-se de brasileiros, são competentes as autoridades consulares brasileiras para lhes celebrar o casamento e os mais atos de Registro Civil e de tabelionato.","question":"Qual situação, dentre as seguintes, pode ser realizada por autoridade consular brasileira observados os requisitos legais?","choices":["Divórcio consensual com filhos menores, sem qualquer cautela","Registro de nascimento nos casos previstos","Qualquer sentença criminal estrangeira","Aprovação de todas as leis estrangeiras"],"correct":1,"why":"O art. 18 abrange atos de registro civil e tabelionato e disciplina o divórcio consensual consular em hipóteses específicas.","flag":null,"terms":[],"group":"16-18"},{"n":19,"title":"Uma regra histórica de transição","scene":"Um ato praticado por consulado no período antigo da LINDB precisa ter sua validade compreendida. J consulta uma regra transitória.","rule":"O art. 19 trata da validade de atos consulares celebrados durante a vigência do decreto-lei, desde que cumpridos requisitos legais; seu parágrafo prevê janela histórica de renovação de pedido recusado em 90 dias após a publicação da lei correspondente.","legal":"Reputam-se válidos todos os atos indicados no artigo anterior [...] desde que satisfaçam todos os requisitos legais.","question":"O prazo de 90 dias do parágrafo único do art. 19 é melhor compreendido como:","choices":["Regra permanente para toda ação de divórcio","Prazo histórico de renovação em situação transitória específica","Prazo geral para entrada em vigor de qualquer lei","Prazo para recorrer em qualquer processo"],"correct":1,"why":"Os 90 dias são uma disposição transitória vinculada à publicação de legislação específica, não um prazo geral que se renova hoje.","flag":"Regra de caráter histórico/transitório: não aplicar “90 dias” genericamente a atos consulares atuais.","terms":[],"group":"19-21"},{"n":20,"title":"A consequência também importa","scene":"J pensa em anular uma medida somente porque invoca “interesse público” em abstrato. H pergunta: “E as consequências concretas?”.","rule":"Nas esferas administrativa, de controle e judicial, não se decide com base em valores jurídicos abstratos sem avaliar consequências práticas. A motivação mostra necessidade, adequação e alternativas.","legal":"Não se decidirá com base em valores jurídicos abstratos sem que sejam consideradas as consequências práticas da decisão.","question":"Uma decisão fundada apenas no “interesse público” abstrato, ignorando os efeitos concretos, contraria qual exigência?","choices":["Consideração das consequências práticas","Exigência de prova de lei estrangeira","Prazo de 45 dias","Aplicação automática de lei antiga"],"correct":0,"why":"O art. 20 exige consideração de consequências e motivação da necessidade e adequação da medida.","flag":null,"terms":[],"group":"19-21"},{"n":21,"title":"Anular exige explicar o depois","scene":"J declara inválido um contrato administrativo. B pergunta como ficará a situação dos envolvidos a partir da decisão.","rule":"A decisão invalidante deve indicar expressamente consequências jurídicas e administrativas; quando cabível, condições de regularização proporcionais e equânimes, sem perdas anormais ou excessivas.","legal":"A decisão [...] que decretar a invalidação de ato, contrato, ajuste, processo ou norma administrativa deverá indicar de modo expresso suas consequências jurídicas e administrativas.","question":"Ao invalidar um ato administrativo, o que a decisão precisa indicar expressamente?","choices":["Somente a opinião pessoal do julgador","A marca do equipamento utilizado","Consequências jurídicas e administrativas","O prazo de 90 dias para qualquer recurso"],"correct":2,"why":"O art. 21 exige indicar consequências e, se cabível, condições proporcionais de regularização.","flag":null,"terms":[],"group":"19-21"},{"n":22,"title":"O gestor diante de obstáculos","scene":"G precisa entregar uma política pública, mas enfrenta escassez, entraves e pressões reais. J avalia sua conduta.","rule":"A interpretação das normas de gestão pública considera dificuldades reais do gestor e exigências das políticas públicas, sem prejuízo aos direitos dos administrados. Nas sanções, avaliam-se gravidade, danos, circunstâncias e antecedentes.","legal":"Na interpretação de normas sobre gestão pública, serão considerados os obstáculos e as dificuldades reais do gestor e as exigências das políticas públicas a seu cargo.","question":"Ao avaliar a atuação de G, o julgador deve considerar:","choices":["Apenas o resultado ideal, ignorando obstáculos","Obstáculos reais e exigências das políticas públicas","Somente o salário do gestor","Exclusivamente a idade do gestor"],"correct":1,"why":"O art. 22 exige contextualização real, mas não elimina direitos dos administrados nem responsabilidade por irregularidades.","flag":null,"terms":[],"group":"22-24"},{"n":23,"title":"Nova interpretação, nova exigência","scene":"Uma autoridade passa a interpretar de modo novo uma norma de conteúdo indeterminado e cria dever adicional para H.","rule":"Se uma nova interpretação ou orientação impõe novo dever ou condicionamento, deve-se prever regime de transição quando indispensável ao cumprimento proporcional, equânime e eficiente.","legal":"A decisão [...] que estabelecer interpretação ou orientação nova sobre norma de conteúdo indeterminado [...] deverá prever regime de transição quando indispensável.","question":"Quando a nova orientação impõe dever inesperado e exige adaptação para cumprimento proporcional, a autoridade deve:","choices":["Criar regime de transição, se indispensável","Ignorar a mudança","Pedir homologação do STF","Impor multa automática sem motivação"],"correct":0,"why":"O regime de transição é condicionado à indispensabilidade, não obrigatório em toda modificação interpretativa.","flag":null,"terms":[],"group":"22-24"},{"n":24,"title":"Não julgue ontem com a régua de amanhã","scene":"H concluiu um procedimento conforme orientação geral então vigente. Anos depois surge interpretação administrativa diversa.","rule":"Na revisão da validade de ato já concluído, consideram-se as orientações gerais da época; mudança posterior de orientação geral não pode invalidar situação plenamente constituída.","legal":"A revisão [...] levará em conta as orientações gerais da época, sendo vedado que, com base em mudança posterior [...] se declarem inválidas situações plenamente constituídas.","question":"Uma situação foi plenamente constituída seguindo orientação geral antiga. A mudança posterior, por si só:","choices":["Invalida sempre o ato","Não autoriza invalidá-la apenas por essa mudança","Torna o ato crime","Reabre automaticamente coisa julgada"],"correct":1,"why":"O art. 24 preserva a confiança nas orientações gerais vigentes ao tempo da produção do ato.","flag":null,"terms":[],"group":"22-24"},{"n":25,"title":"Aqui houve veto","scene":"B procura uma regra substantiva no art. 25 e encontra apenas o aviso “VETADO”.","rule":"O art. 25 da LINDB está vetado; não há conteúdo normativo nesse dispositivo para aplicar.","legal":"Art. 25. (VETADO).","question":"Qual afirmação sobre o art. 25 da LINDB está correta?","choices":["Fixa o prazo de 25 dias","Traz regra expressa de competência","Foi vetado","Revoga integralmente o art. 24"],"correct":2,"why":"Artigo vetado não fornece regra aplicável.","flag":null,"terms":["veto: recusa de sanção a dispositivo na formação da lei"],"group":"25-27"},{"n":26,"title":"Compromisso para resolver incerteza","scene":"A autoridade A, H e o órgão jurídico tentam solucionar uma situação de irregularidade ou incerteza na aplicação do direito público.","rule":"Com razões de relevante interesse geral e após ouvir órgão jurídico (e consulta pública quando cabível), a autoridade pode celebrar compromisso. Seus efeitos começam com publicação oficial; obrigações, prazos e sanções devem ser claros.","legal":"[...] poderá [...] celebrar compromisso com os interessados [...] o qual só produzirá efeitos a partir de sua publicação oficial.","question":"Quando começa a produzir efeitos o compromisso previsto no art. 26?","choices":["Na conversa informal entre os envolvidos","A partir da publicação oficial","Sempre 45 dias depois do acordo","Somente ao fim de um mandato"],"correct":1,"why":"A eficácia do compromisso depende da publicação oficial, além dos demais requisitos legais.","flag":null,"terms":[],"group":"25-27"},{"n":27,"title":"Compensar vantagens e perdas injustas","scene":"Um processo beneficiou indevidamente B e provocou perda anormal a H. A autoridade considera uma compensação.","rule":"A decisão pode impor compensação por benefícios indevidos ou prejuízos anormais ou injustos. Deve ser fundamentada e precedida da oitiva das partes sobre cabimento, forma e valor, se houver.","legal":"A decisão do processo [...] poderá impor compensação por benefícios indevidos ou prejuízos anormais ou injustos.","question":"Antes de estabelecer a compensação do art. 27, o decisor deve:","choices":["Ouvir previamente as partes sobre cabimento, forma e, se for o caso, valor","Ignorar os participantes","Exigir sempre sete peritos","Esperar cinco anos obrigatoriamente"],"correct":0,"why":"O art. 27, §1º, prevê motivação e manifestação prévia das partes.","flag":null,"terms":[],"group":"25-27"},{"n":28,"title":"Erro comum não é erro grosseiro","scene":"G emite parecer técnico. H o acusa de responsabilidade pessoal por qualquer erro, mesmo o mais leve.","rule":"O agente público responde pessoalmente por suas decisões ou opiniões técnicas em caso de dolo ou erro grosseiro; não por qualquer divergência interpretativa de boa-fé.","legal":"O agente público responderá pessoalmente por suas decisões ou opiniões técnicas em caso de dolo ou erro grosseiro.","question":"Qual dupla constitui o critério expresso para responsabilidade pessoal de G?","choices":["Atraso e impopularidade","Qualquer erro e qualquer crítica","Dolo ou erro grosseiro","Mudança legislativa e vacatio"],"correct":2,"why":"O art. 28 utiliza dolo ou erro grosseiro; não equipare automaticamente erro leve a erro grosseiro.","flag":null,"terms":["dolo: conduta intencional","erro grosseiro: falha grave e manifesta"],"group":"28-30"},{"n":29,"title":"A população é ouvida","scene":"Antes de editar um ato normativo, a autoridade A considera abrir um formulário público de contribuições.","rule":"A edição de atos normativos por autoridade administrativa, salvo os de mera organização interna, poderá ser precedida de consulta pública, preferencialmente eletrônica. A convocação deve conter minuta, prazo e condições.","legal":"A edição de atos normativos por autoridade administrativa [...] poderá ser precedida de consulta pública para manifestação de interessados.","question":"Conforme a regra geral do art. 29, a consulta pública antes do ato normativo:","choices":["É sempre obrigatória sem exceção","É proibida por meio eletrônico","Pode ocorrer, com preferência por meio eletrônico","Só pode ser realizada pelo Judiciário"],"correct":2,"why":"O verbo legal é “poderá”. Consulta pública, quando adotada, deve ser considerada na decisão e ter minuta, prazo e condições.","flag":null,"terms":[],"group":"28-30"},{"n":30,"title":"Estabilidade na aplicação das normas","scene":"A e H recebem orientações administrativas divergentes. A autoridade decide organizar suas respostas e regulamentos para melhorar a previsibilidade.","rule":"Autoridades públicas devem promover segurança jurídica na aplicação das normas, inclusive com regulamentos, súmulas administrativas e respostas a consultas. Tais instrumentos vinculam os órgãos ou entidades destinatários até revisão posterior.","legal":"As autoridades públicas devem atuar para aumentar a segurança jurídica na aplicação das normas, inclusive por meio de regulamentos, súmulas administrativas e respostas a consultas.","question":"Os instrumentos previstos no art. 30 vinculam o órgão ou entidade destinatário:","choices":["Somente durante 24 horas","Até ulterior revisão","Pelo prazo fixo de cinco meses","Jamais, pois são sempre mera opinião"],"correct":1,"why":"O parágrafo único do art. 30 atribui caráter vinculante ao órgão ou entidade destinatário, até revisão.","flag":null,"terms":[],"group":"28-30"}];window.ASSETS={"01-03":"assets/lindb-01-03.webp","04-06":"assets/lindb-04-06.webp","07-09":"assets/lindb-07-09.webp","10-12":"assets/lindb-10-12.webp","13-15":"assets/lindb-13-15.webp","16-18":"assets/lindb-16-18.webp","19-21":"assets/lindb-19-21.webp","22-24":"assets/lindb-22-24.webp","25-27":"assets/lindb-25-27.webp","28-30":"assets/lindb-28-30.webp"};</script>
